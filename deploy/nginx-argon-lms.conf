# ============================================================================
# Hostinger VPS Nginx Reverse Proxy Configuration — Gemini Argon LMS (C-030)
# Place in /etc/nginx/sites-available/argon-lms.conf and symlink to sites-enabled
# ============================================================================

upstream argon_backend_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream argon_frontend_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name lms.institute.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lms.institute.edu;

    # Let's Encrypt TLS Certificates on Hostinger VPS
    ssl_certificate     /etc/letsencrypt/live/lms.institute.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.institute.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 55M;

    # Hardened Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API v1 requests to Express Backend (:4000)
    location /api/v1/ {
        proxy_pass http://argon_backend_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all 4 Role Portals (/admin, /student, /teacher, /support) to Next.js (:3000)
    location / {
        proxy_pass http://argon_frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
